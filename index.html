<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7efd9"><title>亂畫一通救貓咪</title><style>
*{box-sizing:border-box}body{margin:0;color:#55443a;background:#f4e8cf;font-family:ui-rounded,"PingFang TC","Microsoft JhengHei",sans-serif;background-image:radial-gradient(#dbc9a555 1px,transparent 1px);background-size:8px 8px}main{max-width:520px;margin:auto;padding:16px 16px 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.eyebrow{font-size:12px;letter-spacing:.13em;font-weight:800;color:#b27958;margin:0}h1{font-size:clamp(24px,6vw,33px);margin:2px 0 0;letter-spacing:.02em}h1 span{color:#e68853}.round{border:2px solid #aa8c6b;border-radius:50%;width:44px;height:44px;background:#fffaf0;font-size:21px;cursor:pointer;color:#735d4f;flex-shrink:0}.card{background:#fffaf0;border:2px solid #a99072;border-radius:22px;box-shadow:4px 5px 0 #d4c09e;margin-top:14px;padding:12px}.levelrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{background:#f9cf9d;color:#75472d;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:800}.levelnav{display:flex;gap:5px}.levelnav button{border:0;background:#eee0c9;color:#806c58;border-radius:50%;width:31px;height:31px;font-weight:800;cursor:pointer}.levelnav button.active{background:#e99664;color:white}.levelnav button:disabled{opacity:.4;cursor:not-allowed}.title{font-size:20px;margin:12px 2px 1px}.desc{font-size:14px;color:#816c58;margin:0 2px 9px;min-height:20px}.scene{position:relative;overflow:hidden;border-radius:15px;border:2px solid #d8c7a8;background:#fffcf3;touch-action:none}canvas{display:block;width:100%;height:auto;touch-action:none}.bubble{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:82%;text-align:center;background:#fffaf2f2;border:2px solid #a88769;border-radius:18px;padding:15px;box-shadow:3px 4px 0 #d4c2a6}.bubble[hidden]{display:none}.bubble strong{display:block;font-size:23px}.bubble p{font-size:14px;margin:8px 0 12px}.actions{display:flex;gap:8px;justify-content:center}.btn{border:2px solid #9f765c;background:#f7c36f;border-radius:12px;padding:10px 15px;color:#674632;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #b68b69}.btn.secondary{background:#fffaf1}.toolbar{display:flex;align-items:center;gap:10px;margin-top:12px}.ink{flex:1}.ink label{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:#8b7159;margin-bottom:5px}.meter{height:12px;border:2px solid #a99176;border-radius:99px;background:#efe4d2;overflow:hidden}.meter span{display:block;background:#6d9eb8;height:100%;width:100%;transition:width .1s}.hint{border:0;background:#fff0cc;border-radius:10px;padding:8px 10px;color:#8b673e;font-weight:800;cursor:pointer}.bottom{text-align:center;color:#9d8a72;font-size:12px;margin:15px 0 0}.guide{margin-top:12px;text-align:center;font-weight:700;font-size:14px;color:#836e5a}.tip{font-size:13px;background:#fff0ca;border-radius:10px;margin:9px 0 0;padding:9px;color:#775e42}.tip[hidden]{display:none}button:focus-visible{outline:3px solid #4d91ba;outline-offset:3px}@media(max-width:380px){main{padding:10px}.card{margin-top:8px;padding:9px}.title{margin-top:7px}.bottom{margin-top:10px}}
</style></head><body><main><div class="top"><div><p class="eyebrow">A LITTLE DRAWING ADVENTURE</p><h1>亂畫一通<span>救貓咪</span></h1></div><button class="round" id="sound" aria-label="開啟音效" title="開啟音效">♪</button></div><section class="card"><div class="levelrow"><span class="badge" id="badge">第 1 關 · 試玩版</span><nav class="levelnav" aria-label="選擇關卡"><button data-level="0" class="active" aria-label="第 1 關">1</button><button data-level="1" aria-label="第 2 關">2</button><button data-level="2" aria-label="第 3 關">3</button></nav></div><h2 class="title" id="title"></h2><p class="desc" id="desc"></p><div class="scene"><canvas id="game" width="400" height="480" aria-label="遊戲畫布：按住並拖曳畫一條線，放開後開始遊戲"></canvas><div class="bubble" id="result" hidden><strong id="resultTitle"></strong><p id="resultDesc"></p><div class="actions"><button class="btn secondary" id="again">再試一次</button><button class="btn" id="next">下一關 →</button></div></div></div><div class="toolbar"><div class="ink"><label><span>✎ 蠟筆剩餘</span><span id="inkText">100%</span></label><div class="meter"><span id="meter"></span></div></div><button class="hint" id="hint">💡 提示</button><button class="round" id="reset" aria-label="重新開始" title="重新開始">↻</button></div><p class="tip" id="tip" hidden></p><p class="guide" id="guide">👆 按住畫一筆，放開後看看會發生什麼！</p></section><p class="bottom">手繪小小原型 ✦ 用你的奇怪點子救救貓</p></main><script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');const $=s=>document.querySelector(s);const W=400,H=480,MAX=355;const levels=[{title:'小貓過水坑',desc:'畫一座橋，讓小貓走到對岸！',tip:'從左邊草地的邊緣，畫一條稍微平緩的線到右邊草地。'}, {title:'小魚快過來',desc:'畫斜坡，讓小魚滾到貓咪面前。',tip:'從小魚下方往右下方畫一條斜坡，接到小貓旁邊的平台。'}, {title:'幫小貓擋雨',desc:'畫一把大傘，撐過這場大雨！',tip:'在小貓上方畫一條長長的線，擋住從天空掉下來的雨。'}];let level=0,unlocked=1,sound=false,audio=null,mode='draw',points=[],length=0,body=null,drops=[],wet=0,t=0,last=0,raf=0,drawPointer=null;const colors={ink:'#5489a3',ground:'#9abd78',brown:'#79593f'};
function sfx(freq=500){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.15);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.16)}catch(e){}}
function rounded(x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill()}
function line(x1,y1,x2,y2,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function cat(x,y,scale=1,face='normal'){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.lineWidth=2.5;ctx.strokeStyle='#8b583c';ctx.fillStyle='#f5ac66';ctx.beginPath();ctx.ellipse(0,5,20,16,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-17,-5);ctx.lineTo(-17,-23);ctx.lineTo(-5,-16);ctx.lineTo(6,-16);ctx.lineTo(17,-23);ctx.lineTo(17,-5);ctx.quadraticCurveTo(20,12,0,13);ctx.quadraticCurveTo(-20,12,-17,-5);ctx.fill();ctx.stroke();ctx.fillStyle='#543f36';ctx.beginPath();ctx.arc(-7,-3,2.4,0,7);ctx.arc(7,-3,2.4,0,7);ctx.fill();line(-2,3,2,3,'#c46e5b',2);line(-3,7,0,9,'#8b583c',1.4);line(0,9,4,7,'#8b583c',1.4);if(face==='wet'){ctx.fillStyle='#5b9ec0';ctx.font='18px sans-serif';ctx.fillText('💧',15,-19)}ctx.restore()}
function fish(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#edaa63';ctx.strokeStyle='#9d6d46';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,13,8,0,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-11,0);ctx.lineTo(-20,-8);ctx.lineTo(-20,8);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#574238';ctx.beginPath();ctx.arc(6,-2,1.7,0,7);ctx.fill();ctx.restore()}
function scenery(){ctx.fillStyle='#fffcf3';ctx.fillRect(0,0,W,H);for(let i=0;i<80;i++){let x=(i*83)%400,y=(i*137)%480;ctx.fillStyle='#d9c7a322';ctx.fillRect(x,y,2,2)}ctx.fillStyle='#efd58b';ctx.beginPath();ctx.arc(51,52,19,0,7);ctx.fill();for(let i=0;i<8;i++){let a=i*Math.PI/4;line(51+Math.cos(a)*27,52+Math.sin(a)*27,51+Math.cos(a)*34,52+Math.sin(a)*34,'#efd58b',3)}ctx.fillStyle='#e9f0ee';rounded(250,40,74,18,12,'#e9f0ee');rounded(273,31,36,26,14,'#e9f0ee');if(level===0){rounded(0,410,400,70,0,'#b8dce6');for(let i=0;i<5;i++)line(20+i*79,440,54+i*79,440,'#e8f5f1',3);platform(0,310,92,170);platform(300,310,100,170);ctx.fillStyle='#8ab66f';ctx.font='22px sans-serif';ctx.fillText('⚑',337,300);cat(body?body.x:60,body?body.y:285,1,mode==='fail'?'wet':'normal')}
if(level===1){platform(0,180,72,300);platform(280,365,120,115);cat(341,340,1);fish(body?body.x:53,body?body.y:160);ctx.fillStyle='#cb9c70';ctx.font='14px sans-serif';ctx.fillText('小魚',20,135)}if(level===2){platform(0,400,400,80);cat(200,375,1,wet>=3?'wet':'normal');for(const d of drops){line(d.x,d.y,d.x-2,d.y+10,'#7bb9d3',3)}ctx.fillStyle='#8d8177';ctx.font='bold 13px sans-serif';ctx.fillText('撐住！ '+Math.max(0,Math.ceil(6-t))+' 秒',152,145)}
if(points.length){ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle=colors.ink;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.stroke();ctx.strokeStyle='#a2c2cc';ctx.lineWidth=1.2;ctx.stroke()}}
function platform(x,y,w,h){ctx.fillStyle='#d5b994';ctx.fillRect(x,y,w,h);ctx.fillStyle=colors.ground;ctx.fillRect(x,y,w,12);line(x,y+12,x+w,y+12,'#849f6f',2)}
function reset(n=level){level=n;mode='draw';points=[];length=0;drops=[];wet=0;t=0;last=0;drawPointer=null;body=level===0?{x:60,y:285,vx:0,vy:0,r:20}:level===1?{x:53,y:159,vx:0,vy:0,r:12}:null;$('#result').hidden=true;$('#tip').hidden=true;$('#title').textContent=levels[level].title;$('#desc').textContent=levels[level].desc;$('#tip').textContent=levels[level].tip;$('#badge').textContent=`第 ${level+1} 關 · 試玩版`;$('#guide').textContent='👆 按住畫一筆，放開後看看會發生什麼！';document.querySelectorAll('[data-level]').forEach((b,i)=>{b.classList.toggle('active',i===level);b.disabled=i>=unlocked});updateInk();scenery()}
function updateInk(){let p=Math.max(0,Math.round((1-length/MAX)*100));$('#meter').style.width=p+'%';$('#inkText').textContent=p+'%'}
function pos(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(W,(e.clientX-r.left)*W/r.width)),y:Math.max(0,Math.min(H,(e.clientY-r.top)*H/r.height))}}
function allowed(p){if(level===0)return p.y>120&&p.y<350&&!(p.x<88&&p.y>300)&&!(p.x>305&&p.y>300)&&Math.hypot(p.x-60,p.y-285)>24;if(level===1)return p.y>100&&p.y<390&&!(p.x<70&&p.y>175)&&!(p.x>280&&p.y>365)&&Math.hypot(p.x-53,p.y-159)>15;return p.y>105&&p.y<350&&Math.hypot(p.x-200,p.y-375)>26}
canvas.addEventListener('pointerdown',e=>{if(mode!=='draw')return;let p=pos(e);if(!allowed(p)){ $('#guide').textContent='✎ 從空白處開始畫線吧！';return}drawPointer=e.pointerId;canvas.setPointerCapture(e.pointerId);points=[p];e.preventDefault()});canvas.addEventListener('pointermove',e=>{if(drawPointer!==e.pointerId||mode!=='draw')return;let p=pos(e),prev=points[points.length-1],d=Math.hypot(p.x-prev.x,p.y-prev.y);if(d<2)return;if(!allowed(p))return;let remaining=MAX-length;if(remaining<=0)return;if(d>remaining){p={x:prev.x+(p.x-prev.x)*remaining/d,y:prev.y+(p.y-prev.y)*remaining/d};d=remaining}points.push(p);length+=d;updateInk();scenery();e.preventDefault()});function finish(e){if(drawPointer!==e.pointerId)return;drawPointer=null;if(points.length<2||length<15){points=[];length=0;updateInk();$('#guide').textContent='再畫長一點，才能幫上忙喔！';scenery();return}mode='run';$('#guide').textContent='✨ 看看你的點子會發生什麼！';sfx(520)}canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',()=>{drawPointer=null;points=[];length=0;updateInk();scenery()});
function lineHeight(x,y,oldY,r){let best=null;for(let i=1;i<points.length;i++){let a=points[i-1],b=points[i];if(Math.abs(b.x-a.x)<.1||x<Math.min(a.x,b.x)-r*.3||x>Math.max(a.x,b.x)+r*.3)continue;let u=Math.max(0,Math.min(1,(x-a.x)/(b.x-a.x))),v=a.y+(b.y-a.y)*u;if(oldY+r<=v+9&&y+r>=v-2&&(best===null||v<best))best=v}return best}
function showResult(win){if(mode!=='run')return;mode=win?'win':'fail';sfx(win?750:180);if(win){unlocked=Math.max(unlocked,Math.min(3,level+2));document.querySelectorAll('[data-level]').forEach((b,i)=>b.disabled=i>=unlocked)}$('#resultTitle').textContent=win?(level===2?'太厲害啦！🎉':'成功啦！ ✨'):'哎呀，再試試！';$('#resultDesc').textContent=win?(level===2?'三關都通過了，謝謝你救了小貓！':'你的奇妙點子救了小貓！'):(level===2?'小貓被雨淋濕了，換個畫法吧。':'沒關係，重新畫一筆試試。');$('#next').hidden=!win;$('#next').textContent=level===2?'再玩一次 ↻':'下一關 →';$('#result').hidden=false;$('#guide').textContent=win?'太棒了！每個點子都值得試試。':'失敗也是好玩的發現！'}
function update(dt){t+=dt;if(level<2){let b=body,old=b.y;b.vy+=520*dt;if(level===0)b.vx=60;else b.vx=Math.min(110,b.vx+30*dt);b.x+=b.vx*dt;b.y+=b.vy*dt;let ground=null;if(level===0&&((b.x<90)||(b.x>300)))ground=310;if(level===1&&b.x<70)ground=180;if(level===1&&b.x>280)ground=365;let l=lineHeight(b.x,b.y,old,b.r);if(l!==null&&(ground===null||l<ground))ground=l;if(ground!==null&&old+b.r<=ground+8&&b.y+b.r>=ground){b.y=ground-b.r;b.vy=0}if(level===0&&b.x>325&&b.y>=280&&b.y<310)showResult(true);if(level===1&&b.x>305&&b.y>320&&b.y<365)showResult(true);if(b.y>H+25||b.x>W+30||t>12)showResult(false)}else{if(Math.floor(t*10)!==Math.floor((t-dt)*10)){let xs=[155,180,200,220,245,165,235,190,210];drops.push({x:xs[Math.floor(t*10)%xs.length],y:90})}for(const d of drops){let old=d.y;d.y+=130*dt;let l=lineHeight(d.x,d.y,old,0);if(l!==null)d.dead=true;else if(d.y>=355&&d.x>174&&d.x<226){d.dead=true;wet++}else if(d.y>420)d.dead=true}drops=drops.filter(d=>!d.dead);if(wet>=3)showResult(false);else if(t>=6)showResult(true)}}
function loop(ts){let dt=last?Math.min((ts-last)/1000,.033):0;last=ts;if(mode==='run')update(dt);scenery();raf=requestAnimationFrame(loop)}
$('#reset').onclick=()=>reset();$('#again').onclick=()=>reset();$('#next').onclick=()=>reset(level===2?0:level+1);$('#hint').onclick=()=>{$('#tip').hidden=!$('#tip').hidden};$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'♫':'♪';$('#sound').setAttribute('aria-label',sound?'關閉音效':'開啟音效');$('#sound').title=sound?'關閉音效':'開啟音效';if(sound)sfx()};document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>reset(Number(b.dataset.level)));reset();raf=requestAnimationFrame(loop);
</script></body></html>
