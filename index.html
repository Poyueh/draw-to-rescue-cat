<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7efd9"><title>亂畫一通救貓咪</title><style>
*{box-sizing:border-box}html{background:#f5ead5}body{margin:0;color:#604639;font-family:ui-rounded,"PingFang TC","Microsoft JhengHei",sans-serif;background:radial-gradient(ellipse at 15% 10%,#fff7e4 0,transparent 43%),radial-gradient(ellipse at 90% 70%,#e8efcf 0,transparent 40%),#f5ead5;min-height:100vh}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E")}main{position:relative;max-width:425px;margin:auto;padding:14px 16px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 6px}.eyebrow{font-size:10px;letter-spacing:.2em;font-weight:900;color:#b48d6b;margin:0 0 4px}h1{font-size:clamp(25px,6vw,34px);margin:0;letter-spacing:.04em;color:#66473a;text-shadow:1px 2px #fff5dc}h1 span{color:#df875e}.round{border:2px solid #dbc7a9;border-radius:50%;width:42px;height:42px;background:#fffaf0;font-size:21px;cursor:pointer;color:#9a765e;flex-shrink:0;box-shadow:0 3px 0 #e7d6bd}.card{background:#fff9ed;border:1px solid #edddc5;border-radius:28px;box-shadow:0 16px 38px #a9805b27,0 3px 0 #e5d2b6;margin-top:14px;padding:15px}.levelrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{background:#f7ddc3;color:#ad7255;border-radius:99px;padding:7px 12px;font-size:11px;letter-spacing:.05em;font-weight:900}.levelnav{display:flex;gap:6px}.levelnav button{border:1px solid #e8d7bc;background:#fbf2e4;color:#bda68b;border-radius:50%;width:31px;height:31px;font-weight:800;cursor:pointer}.levelnav button.active{background:#d98766;color:white;border-color:#d98766;box-shadow:0 3px 0 #d9b194}.levelnav button:disabled{opacity:.5;cursor:not-allowed}.title{font-size:21px;margin:13px 3px 3px;letter-spacing:.04em}.desc{font-size:13px;color:#a18772;margin:0 3px 12px;min-height:20px}.scene{position:relative;overflow:hidden;border-radius:20px;border:4px solid #f7ead4;background:#fff7e5;touch-action:none;box-shadow:inset 0 0 0 1px #e1d4bd}canvas{display:block;width:100%;height:auto;touch-action:none}.bubble{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%) rotate(-1deg);width:82%;text-align:center;background:#fffaf2f5;border:2px solid #d6b491;border-radius:22px;padding:18px;box-shadow:0 7px 0 #c6a78c55}.bubble[hidden]{display:none}.bubble strong{display:block;font-size:24px;color:#bf7653}.bubble p{font-size:14px;margin:8px 0 14px}.actions{display:flex;gap:8px;justify-content:center}.btn{border:0;background:#df936c;border-radius:13px;padding:11px 15px;color:white;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #bb785a}.btn.secondary{background:#f7e9d4;color:#8b705c;box-shadow:0 3px 0 #dfcbb3}.toolbar{display:flex;align-items:center;gap:11px;margin-top:13px;padding:0 3px}.ink{flex:1}.ink label{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.04em;font-weight:800;color:#a88970;margin-bottom:5px}.meter{height:11px;border-radius:99px;background:#eee1ce;overflow:hidden}.meter span{display:block;background:repeating-linear-gradient(120deg,#78a6a2 0 8px,#91b7aa 8px 13px);height:100%;width:100%;transition:width .1s}.hint{border:1px solid #efdfbd;background:#fff1d0;border-radius:12px;padding:9px 10px;color:#ac8055;font-weight:800;cursor:pointer}.bottom{text-align:center;color:#b7a084;font-size:11px;letter-spacing:.08em;margin:15px 0 0}.guide{margin:13px 0 1px;text-align:center;font-weight:700;font-size:13px;color:#a28a75}.tip{font-size:13px;background:#fff0d1;border-radius:12px;margin:10px 0 0;padding:10px;color:#8e7054}.tip[hidden]{display:none}button:focus-visible{outline:3px solid #7eb3ae;outline-offset:3px}@media(max-width:380px){main{padding:12px}.card{margin-top:10px;padding:11px}.title{margin-top:9px}.bottom{margin-top:10px}}
</style></head><body><main><div class="top"><div><p class="eyebrow">A LITTLE CRAYON ADVENTURE</p><h1>亂畫一通<span>救貓咪</span></h1></div><button class="round" id="sound" aria-label="開啟音效" title="開啟音效">♪</button></div><section class="card"><div class="levelrow"><span class="badge" id="badge">第 1 關 · 試玩版</span><nav class="levelnav" aria-label="選擇關卡"><button data-level="0" class="active" aria-label="第 1 關">1</button><button data-level="1" aria-label="第 2 關">2</button><button data-level="2" aria-label="第 3 關">3</button></nav></div><h2 class="title" id="title"></h2><p class="desc" id="desc"></p><div class="scene"><canvas id="game" width="400" height="480" aria-label="遊戲畫布：按住並拖曳畫一條線，放開後開始遊戲"></canvas><div class="bubble" id="result" hidden><strong id="resultTitle"></strong><p id="resultDesc"></p><div class="actions"><button class="btn secondary" id="again">再試一次</button><button class="btn" id="next">下一關 →</button></div></div></div><div class="toolbar"><div class="ink"><label><span>✎ 蠟筆剩餘</span><span id="inkText">100%</span></label><div class="meter"><span id="meter"></span></div></div><button class="hint" id="hint">💡 提示</button><button class="round" id="reset" aria-label="重新開始" title="重新開始">↻</button></div><p class="tip" id="tip" hidden></p><p class="guide" id="guide">👆 按住畫一筆，放開後看看會發生什麼！</p></section><p class="bottom">手繪小小原型 ✦ 用你的奇怪點子救救貓</p></main><script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');const $=s=>document.querySelector(s);const W=400,H=480,MAX=355;const levels=[{title:'小貓過水坑',desc:'畫一座橋，讓小貓走到對岸！',tip:'從左邊懸崖邊緣，畫一條平緩的線到對岸。'}, {title:'小魚快過來',desc:'畫斜坡，讓小魚滾到貓咪面前。',tip:'從小魚下方往右下方畫一條斜坡，接到小貓旁邊的平台。'}, {title:'幫小貓擋雨',desc:'畫一把大傘，撐過這場大雨！',tip:'在小貓上方畫一條長長的線，擋住從天空掉下來的雨。'}];let level=0,unlocked=1,sound=false,audio=null,mode='draw',points=[],length=0,body=null,drops=[],wet=0,t=0,last=0,raf=0,drawPointer=null;const colors={ink:'#4b829d',ground:'#8bac73',brown:'#79593f'};const meadow=new Image();meadow.src='assets/meadow.jpg';const creek=new Image();creek.src='assets/creek.jpg';const kitty=new Image();kitty.src='assets/kitty.png';
function sfx(freq=500){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.15);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.16)}catch(e){}}
function rounded(x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill()}
function line(x1,y1,x2,y2,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function cat(x,y,scale=1,face='normal'){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);if(kitty.complete&&kitty.naturalWidth){ctx.drawImage(kitty,-38,-48,76,68)}else{ctx.fillStyle='#eaa267';ctx.beginPath();ctx.ellipse(0,0,20,20,0,0,Math.PI*2);ctx.fill()}if(face==='wet'){ctx.fillStyle='#5b9ec0';ctx.font='18px sans-serif';ctx.fillText('💧',15,-24)}ctx.restore()}
function fish(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#edaa63';ctx.strokeStyle='#9d6d46';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,13,8,0,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-11,0);ctx.lineTo(-20,-8);ctx.lineTo(-20,8);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#574238';ctx.beginPath();ctx.arc(6,-2,1.7,0,7);ctx.fill();ctx.restore()}
function scenery(){ctx.fillStyle='#fff8e9';ctx.fillRect(0,0,W,H);if(level===0&&creek.complete&&creek.naturalWidth)ctx.drawImage(creek,0,0,W,H);else if(meadow.complete&&meadow.naturalWidth)ctx.drawImage(meadow,0,0,W,H);if(level===0){ctx.save();ctx.globalAlpha=.8;ctx.fillStyle='#fff7e7';ctx.beginPath();ctx.arc(335,294,13,0,7);ctx.fill();ctx.fillStyle='#db9372';ctx.font='bold 16px sans-serif';ctx.fillText('♥',328,300);ctx.restore();let bounce=mode==='run'?Math.abs(Math.sin(t*11))*3:Math.sin(Date.now()/550)*.9;cat(body?body.x:60,(body?body.y:285)-bounce,1,mode==='fail'?'wet':'normal')}
if(level===1){platform(0,180,72,300);platform(280,365,120,115);cat(341,340,1);fish(body?body.x:53,body?body.y:160);ctx.fillStyle='#cb9c70';ctx.font='14px sans-serif';ctx.fillText('小魚',20,135)}if(level===2){platform(0,400,400,80);cat(200,375,1,wet>=3?'wet':'normal');for(const d of drops){line(d.x,d.y,d.x-2,d.y+10,'#7bb9d3',3)}ctx.fillStyle='#8d8177';ctx.font='bold 13px sans-serif';ctx.fillText('撐住！ '+Math.max(0,Math.ceil(6-t))+' 秒',152,145)}
if(points.length){ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle=colors.ink;ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.stroke();ctx.strokeStyle='#c7e0d3';ctx.globalAlpha=.58;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1}}
function platform(x,y,w,h){ctx.fillStyle='#c89f79';ctx.fillRect(x,y,w,h);ctx.fillStyle='#e0c39e';ctx.fillRect(x,y+13,w,h);for(let i=0;i<Math.ceil(w/14);i++){let px=x+i*14;line(px+4,y+26+(i%3)*8,px+1,y+36+(i%3)*8,'#c99f79',1.3)}ctx.fillStyle='#9eb679';ctx.fillRect(x,y,w,11);for(let i=0;i<Math.ceil(w/10);i++){let px=x+i*10;line(px,y+3,px+4,y-4-(i%3)*2,'#769a67',2);line(px+4,y+3,px+8,y-3,'#afc98e',2)}ctx.fillStyle='#fdf4ce';for(let i=0;i<Math.floor(w/35);i++){ctx.beginPath();ctx.arc(x+15+i*35,y+2,2,0,7);ctx.fill()}}
function reset(n=level){level=n;mode='draw';points=[];length=0;drops=[];wet=0;t=0;last=0;drawPointer=null;body=level===0?{x:60,y:285,vx:0,vy:0,r:20}:level===1?{x:53,y:159,vx:0,vy:0,r:12}:null;$('#result').hidden=true;$('#tip').hidden=true;$('#title').textContent=levels[level].title;$('#desc').textContent=levels[level].desc;$('#tip').textContent=levels[level].tip;$('#badge').textContent=`第 ${level+1} 關 · 試玩版`;$('#guide').textContent='👆 按住畫一筆，放開後看看會發生什麼！';document.querySelectorAll('[data-level]').forEach((b,i)=>{b.classList.toggle('active',i===level);b.disabled=i>=unlocked});updateInk();scenery()}
function updateInk(){let p=Math.max(0,Math.round((1-length/MAX)*100));$('#meter').style.width=p+'%';$('#inkText').textContent=p+'%'}
function pos(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(W,(e.clientX-r.left)*W/r.width)),y:Math.max(0,Math.min(H,(e.clientY-r.top)*H/r.height))}}
function allowed(p){if(level===0)return p.y>120&&p.y<350&&!(p.x<126&&p.y>310)&&!(p.x>274&&p.y>310)&&Math.hypot(p.x-60,p.y-285)>24;if(level===1)return p.y>100&&p.y<390&&!(p.x<70&&p.y>175)&&!(p.x>280&&p.y>365)&&Math.hypot(p.x-53,p.y-159)>15;return p.y>105&&p.y<350&&Math.hypot(p.x-200,p.y-375)>26}
canvas.addEventListener('pointerdown',e=>{if(mode!=='draw')return;let p=pos(e);if(!allowed(p)){ $('#guide').textContent='✎ 從空白處開始畫線吧！';return}drawPointer=e.pointerId;canvas.setPointerCapture(e.pointerId);points=[p];e.preventDefault()});canvas.addEventListener('pointermove',e=>{if(drawPointer!==e.pointerId||mode!=='draw')return;let p=pos(e),prev=points[points.length-1],d=Math.hypot(p.x-prev.x,p.y-prev.y);if(d<2)return;if(!allowed(p))return;let remaining=MAX-length;if(remaining<=0)return;if(d>remaining){p={x:prev.x+(p.x-prev.x)*remaining/d,y:prev.y+(p.y-prev.y)*remaining/d};d=remaining}points.push(p);length+=d;updateInk();scenery();e.preventDefault()});function finish(e){if(drawPointer!==e.pointerId)return;drawPointer=null;if(points.length<2||length<15){points=[];length=0;updateInk();$('#guide').textContent='再畫長一點，才能幫上忙喔！';scenery();return}mode='run';$('#guide').textContent='✨ 看看你的點子會發生什麼！';sfx(520)}canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',()=>{drawPointer=null;points=[];length=0;updateInk();scenery()});
function lineHeight(x,y,oldY,r){let best=null;for(let i=1;i<points.length;i++){let a=points[i-1],b=points[i];if(Math.abs(b.x-a.x)<.1||x<Math.min(a.x,b.x)-r*.3||x>Math.max(a.x,b.x)+r*.3)continue;let u=Math.max(0,Math.min(1,(x-a.x)/(b.x-a.x))),v=a.y+(b.y-a.y)*u;if(oldY+r<=v+9&&y+r>=v-2&&(best===null||v<best))best=v}return best}
function showResult(win){if(mode!=='run')return;mode=win?'win':'fail';sfx(win?750:180);if(win){unlocked=Math.max(unlocked,Math.min(3,level+2));document.querySelectorAll('[data-level]').forEach((b,i)=>b.disabled=i>=unlocked)}$('#resultTitle').textContent=win?(level===2?'小貓得救了！🎉':'太棒了，成功！ ✨'):'沒關係，再畫一次！';$('#resultDesc').textContent=win?(level===2?'三關都通過了，謝謝你救了小貓！':'喵嗚！你的畫筆真厲害！'):(level===2?'小貓被雨淋濕了，換個畫法吧。':'沒關係，重新畫一筆試試。');$('#next').hidden=!win;$('#next').textContent=level===2?'再玩一次 ↻':'下一關 →';$('#result').hidden=false;$('#guide').textContent=win?'太棒了！每個點子都值得試試。':'失敗也是好玩的發現！'}
function update(dt){t+=dt;if(level<2){let b=body,old=b.y;b.vy+=520*dt;if(level===0)b.vx=60;else b.vx=Math.min(110,b.vx+30*dt);b.x+=b.vx*dt;b.y+=b.vy*dt;let ground=null;if(level===0&&((b.x<130)||(b.x>270)))ground=310;if(level===1&&b.x<70)ground=180;if(level===1&&b.x>280)ground=365;let l=lineHeight(b.x,b.y,old,b.r);if(l!==null&&(ground===null||l<ground))ground=l;if(ground!==null&&old+b.r<=ground+8&&b.y+b.r>=ground){b.y=ground-b.r;b.vy=0}if(level===0&&b.x>310&&b.y>=280&&b.y<310)showResult(true);if(level===1&&b.x>305&&b.y>320&&b.y<365)showResult(true);if(b.y>H+25||b.x>W+30||t>12)showResult(false)}else{if(Math.floor(t*10)!==Math.floor((t-dt)*10)){let xs=[155,180,200,220,245,165,235,190,210];drops.push({x:xs[Math.floor(t*10)%xs.length],y:90})}for(const d of drops){let old=d.y;d.y+=130*dt;let l=lineHeight(d.x,d.y,old,0);if(l!==null)d.dead=true;else if(d.y>=355&&d.x>174&&d.x<226){d.dead=true;wet++}else if(d.y>420)d.dead=true}drops=drops.filter(d=>!d.dead);if(wet>=3)showResult(false);else if(t>=6)showResult(true)}}
function loop(ts){let dt=last?Math.min((ts-last)/1000,.033):0;last=ts;if(mode==='run')update(dt);scenery();raf=requestAnimationFrame(loop)}
$('#reset').onclick=()=>reset();$('#again').onclick=()=>reset();$('#next').onclick=()=>reset(level===2?0:level+1);$('#hint').onclick=()=>{$('#tip').hidden=!$('#tip').hidden};$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'♫':'♪';$('#sound').setAttribute('aria-label',sound?'關閉音效':'開啟音效');$('#sound').title=sound?'關閉音效':'開啟音效';if(sound)sfx()};document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>reset(Number(b.dataset.level)));reset();raf=requestAnimationFrame(loop);
</script></body></html>
