<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7efd9"><title>亂畫一通救貓咪</title><style>
:root{color-scheme:light;--ink:#58423a;--rust:#bd7155;--paper:#f7eddc;--sage:#8caa89}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-rounded,"PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink)}body{background:#e7dec9;display:grid;place-items:center}body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 14% 6%,#fff9eb 0,transparent 43%),radial-gradient(ellipse at 85% 90%,#d6dfc5 0,transparent 42%);pointer-events:none}button{font:inherit}button:focus-visible{outline:3px solid #548d8a;outline-offset:3px}.game-shell{position:relative;isolation:isolate;width:min(100%,420px);min-height:min(100dvh,900px);background:#f9f3e6;overflow:hidden;box-shadow:0 18px 80px #72594024;display:flex;flex-direction:column}.topbar{position:relative;display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;background:#f9f3e6;z-index:2}.brand{display:flex;align-items:center;gap:10px}.brand-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:14px;background:#e4b290;color:white;font-size:21px;transform:rotate(-7deg)}.brand-name{font-size:15px;font-weight:900;letter-spacing:.06em;line-height:1.25}.brand-sub{font-size:9px;letter-spacing:.15em;color:#aa9480;font-weight:800;margin-top:3px}.round{border:1px solid #ded1bb;border-radius:50%;width:40px;height:40px;background:#fffaf1;font-size:20px;cursor:pointer;color:#9d7f69;box-shadow:0 3px 0 #e7dbc7;flex-shrink:0}.round:active,.tool-button:active,.btn:active{transform:translateY(2px);box-shadow:none}.chapter{background:#f9f3e6;padding:0 20px 13px;display:flex;align-items:center;justify-content:space-between;gap:8px}.chapter-info{display:flex;align-items:center;gap:8px}.chapter-badge{font-size:10px;font-weight:900;letter-spacing:.09em;color:#a36c50}.chapter-dot{width:4px;height:4px;border-radius:50%;background:#d5bfa5}.chapter-name{font-size:10px;font-weight:700;color:#a99784}.levelnav{display:flex;gap:6px}.levelnav button{border:0;background:#ebe4d6;color:#b9a895;border-radius:50%;width:25px;height:25px;font-size:10px;font-weight:900;cursor:pointer}.levelnav button.active{background:#bd8065;color:#fff;box-shadow:0 2px 0 #9e6c55}.levelnav button:disabled{opacity:.55;cursor:not-allowed}.stage-wrap{width:100%;padding:0 12px;display:flex;justify-content:center}.scene{position:relative;overflow:hidden;border:1px solid #e6d8c0;border-radius:22px;background:#f4e9d3;width:min(100%,calc((100dvh - 240px)*.833333));min-width:min(100%,260px);box-shadow:0 7px 0 #e5dac7,0 12px 25px #94755822;touch-action:none}canvas{display:block;width:100%;height:auto;touch-action:none}.objective{position:absolute;z-index:1;top:14px;left:50%;transform:translateX(-50%);width:max-content;max-width:88%;text-align:center;pointer-events:none;padding:10px 18px 9px;background:#fffaf1e8;border:1px solid #fff;border-radius:15px;box-shadow:0 5px 20px #9e806333}.objective-label{display:block;color:#bf9275;letter-spacing:.14em;font-weight:900;font-size:9px;margin-bottom:3px}.title{font-size:17px;letter-spacing:.06em;margin:0;color:#634c40;white-space:nowrap}.desc{font-size:11px;color:#a68b75;margin:3px 0 0;white-space:nowrap}.bubble{position:absolute;z-index:3;left:50%;top:49%;transform:translate(-50%,-50%);width:82%;text-align:center;background:#fffaf1f7;border:1px solid #fff;border-radius:23px;padding:24px 14px 18px;box-shadow:0 10px 32px #7c5e4038}.bubble:before{content:'✦  ✧  ✦';display:block;color:#dfaf72;font-size:18px;letter-spacing:5px;margin-bottom:7px}.bubble[hidden]{display:none}.bubble strong{display:block;font-size:23px;color:#a95f46}.bubble p{font-size:13px;color:#9e806c;margin:8px 0 18px}.actions{display:flex;gap:8px;justify-content:center}.btn{border:0;background:#b9775c;border-radius:13px;padding:11px 15px;color:white;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #985d49}.btn.secondary{background:#f1e6d4;color:#806c5e;box-shadow:0 3px 0 #ddccb4}.controls{padding:18px 21px 12px;display:flex;align-items:center;gap:12px}.ink{flex:1;min-width:0}.ink label{display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:.06em;font-weight:900;color:#9e8a75;margin-bottom:7px}.ink-label{display:flex;align-items:center;gap:5px}.meter{height:10px;border-radius:99px;background:#e7dfd0;overflow:hidden;box-shadow:inset 0 1px 2px #c6b7a0}.meter span{display:block;background:repeating-linear-gradient(125deg,#7fa89c 0 7px,#9abdaf 7px 12px);height:100%;width:100%;border-radius:99px;transition:width .1s}.tool-button{border:1px solid #e7d7bc;background:#fff6e4;border-radius:14px;padding:10px 12px;color:#a67a59;font-size:12px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #e9ddc9;white-space:nowrap}.tip{font-size:12px;background:#fff0d1;border-radius:12px;margin:0 21px 7px;padding:10px;color:#8e7054}.tip[hidden]{display:none}.guide{text-align:center;font-weight:700;font-size:11px;color:#aa9984;letter-spacing:.03em;margin:4px 14px 13px}.note{display:flex;align-items:center;gap:12px;margin:auto 21px 20px;padding:12px 14px;border:1px solid #e8dbc8;border-radius:16px;background:#fffaf0b8}.note-cat{width:42px;height:42px;flex:none;border-radius:50%;background:#f2dfc6 url("assets/kitty.png") center/contain no-repeat}.note-copy{font-size:12px;color:#957762;font-weight:700;line-height:1.5}.note-copy b{display:block;font-size:9px;letter-spacing:.12em;color:#c19b80;margin-bottom:2px}.footer-ornament{margin:0 20px 12px;display:flex;align-items:center;gap:10px;color:#c5b5a0;font-size:9px;letter-spacing:.18em;font-weight:800}.footer-ornament:before,.footer-ornament:after{content:"";height:1px;flex:1;background:#e7ddcd}@media(min-width:600px){.game-shell{min-height:min(100dvh,820px);border-radius:26px}.scene{width:min(100%,calc((100dvh - 250px)*.833333))}body{padding:14px}}@media(max-height:760px){.note{display:none}.footer-ornament{margin-top:auto}}@media(max-height:700px){.topbar{padding:10px 18px 7px}.chapter{padding-bottom:8px}.controls{padding-top:12px}.footer-ornament{display:none}.scene{width:min(100%,calc((100dvh - 205px)*.833333))}}
</style></head><body><main class="game-shell"><header class="topbar"><div class="brand"><div class="brand-icon" aria-hidden="true">✿</div><div><div class="brand-name">亂畫一通救貓咪</div><div class="brand-sub">A LITTLE CRAYON ADVENTURE</div></div></div><button class="round" id="sound" aria-label="開啟音效" title="開啟音效">♪</button></header><div class="chapter"><div class="chapter-info"><span class="chapter-badge" id="badge">第 1 關</span><span class="chapter-dot"></span><span class="chapter-name">小小冒險</span></div><nav class="levelnav" aria-label="選擇關卡"><button data-level="0" class="active" aria-label="第 1 關">01</button><button data-level="1" aria-label="第 2 關">02</button><button data-level="2" aria-label="第 3 關">03</button></nav></div><div class="stage-wrap"><div class="scene"><canvas id="game" width="400" height="480" aria-label="遊戲畫布：按住並拖曳畫一條線，放開後開始遊戲"></canvas><div class="objective"><span class="objective-label">✦　TODAY’S MISSION　✦</span><h1 class="title" id="title"></h1><p class="desc" id="desc"></p></div><div class="bubble" id="result" hidden><strong id="resultTitle"></strong><p id="resultDesc"></p><div class="actions"><button class="btn secondary" id="again">再試一次</button><button class="btn" id="next">下一關 →</button></div></div></div></div><div class="controls"><div class="ink"><label><span class="ink-label">✎　蠟筆能量</span><span id="inkText">100%</span></label><div class="meter"><span id="meter"></span></div></div><button class="tool-button" id="hint">✧ 提示</button><button class="round" id="reset" aria-label="重新開始" title="重新開始">↻</button></div><p class="tip" id="tip" hidden></p><p class="guide" id="guide">按住畫一筆，放開後看看會發生什麼！</p><div class="note"><span class="note-cat" aria-hidden="true"></span><div class="note-copy"><b>小橘的話</b><span id="catQuote">別擔心，我們一起想辦法！</span></div></div><div class="footer-ornament">DRAW A LITTLE MAGIC</div></main><script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');const $=s=>document.querySelector(s);const W=400,H=480,MAX=355;const levels=[{title:'小貓過水坑',desc:'畫一座橋，讓小貓走到對岸！',tip:'從左邊懸崖邊緣，畫一條平緩的線到對岸。'}, {title:'小魚快過來',desc:'畫斜坡，讓小魚滾到貓咪面前。',tip:'從小魚下方往右下方畫一條斜坡，接到小貓旁邊的平台。'}, {title:'幫小貓擋雨',desc:'畫一把大傘，撐過這場大雨！',tip:'在小貓上方畫一條長長的線，擋住從天空掉下來的雨。'}];let level=0,unlocked=1,sound=false,audio=null,mode='draw',points=[],length=0,body=null,drops=[],wet=0,t=0,last=0,raf=0,drawPointer=null;const colors={ink:'#4b829d',ground:'#8bac73',brown:'#79593f'};const meadow=new Image();meadow.src='assets/meadow.jpg';const creek=new Image();creek.src='assets/creek.jpg';const kitty=new Image();kitty.src='assets/kitty.png';
function sfx(freq=500){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.15);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.16)}catch(e){}}
function rounded(x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill()}
function line(x1,y1,x2,y2,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function cat(x,y,scale=1,face='normal'){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);if(kitty.complete&&kitty.naturalWidth){ctx.drawImage(kitty,-38,-48,76,68)}else{ctx.fillStyle='#eaa267';ctx.beginPath();ctx.ellipse(0,0,20,20,0,0,Math.PI*2);ctx.fill()}if(face==='wet'){ctx.fillStyle='#5b9ec0';ctx.font='18px sans-serif';ctx.fillText('💧',15,-24)}ctx.restore()}
function fish(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#edaa63';ctx.strokeStyle='#9d6d46';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,13,8,0,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-11,0);ctx.lineTo(-20,-8);ctx.lineTo(-20,8);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#574238';ctx.beginPath();ctx.arc(6,-2,1.7,0,7);ctx.fill();ctx.restore()}
function scenery(){ctx.fillStyle='#fff8e9';ctx.fillRect(0,0,W,H);if(level===0&&creek.complete&&creek.naturalWidth)ctx.drawImage(creek,0,0,W,H);else if(meadow.complete&&meadow.naturalWidth)ctx.drawImage(meadow,0,0,W,H);if(level===0){ctx.save();ctx.globalAlpha=.8;ctx.fillStyle='#fff7e7';ctx.beginPath();ctx.arc(335,294,13,0,7);ctx.fill();ctx.fillStyle='#db9372';ctx.font='bold 16px sans-serif';ctx.fillText('♥',328,300);ctx.restore();let bounce=mode==='run'?Math.abs(Math.sin(t*11))*3:Math.sin(Date.now()/550)*.9;cat(body?body.x:60,(body?body.y:285)-bounce,1,mode==='fail'?'wet':'normal')}
if(level===1){platform(0,180,72,300);platform(280,365,120,115);cat(341,340,1);fish(body?body.x:53,body?body.y:160);ctx.fillStyle='#cb9c70';ctx.font='14px sans-serif';ctx.fillText('小魚',20,135)}if(level===2){platform(0,400,400,80);cat(200,375,1,wet>=3?'wet':'normal');for(const d of drops){line(d.x,d.y,d.x-2,d.y+10,'#7bb9d3',3)}ctx.fillStyle='#8d8177';ctx.font='bold 13px sans-serif';ctx.fillText('撐住！ '+Math.max(0,Math.ceil(6-t))+' 秒',152,145)}
if(points.length){ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle=colors.ink;ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.stroke();ctx.strokeStyle='#c7e0d3';ctx.globalAlpha=.58;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1}}
function platform(x,y,w,h){ctx.fillStyle='#c89f79';ctx.fillRect(x,y,w,h);ctx.fillStyle='#e0c39e';ctx.fillRect(x,y+13,w,h);for(let i=0;i<Math.ceil(w/14);i++){let px=x+i*14;line(px+4,y+26+(i%3)*8,px+1,y+36+(i%3)*8,'#c99f79',1.3)}ctx.fillStyle='#9eb679';ctx.fillRect(x,y,w,11);for(let i=0;i<Math.ceil(w/10);i++){let px=x+i*10;line(px,y+3,px+4,y-4-(i%3)*2,'#769a67',2);line(px+4,y+3,px+8,y-3,'#afc98e',2)}ctx.fillStyle='#fdf4ce';for(let i=0;i<Math.floor(w/35);i++){ctx.beginPath();ctx.arc(x+15+i*35,y+2,2,0,7);ctx.fill()}}
function reset(n=level){level=n;mode='draw';points=[];length=0;drops=[];wet=0;t=0;last=0;drawPointer=null;body=level===0?{x:60,y:285,vx:0,vy:0,r:20}:level===1?{x:53,y:159,vx:0,vy:0,r:12}:null;$('#result').hidden=true;$('#tip').hidden=true;$('#title').textContent=levels[level].title;$('#catQuote').textContent=['畫一座橋，我們就能到對岸了！','香香的小魚，可不可以送給我？','下雨了！幫我畫一把大傘吧。'][level];$('#desc').textContent=levels[level].desc;$('#tip').textContent=levels[level].tip;$('#badge').textContent=`CHAPTER 0${level+1}`;$('#guide').textContent='按住畫一筆，放開後看看會發生什麼！';document.querySelectorAll('[data-level]').forEach((b,i)=>{b.classList.toggle('active',i===level);b.disabled=i>=unlocked});updateInk();scenery()}
function updateInk(){let p=Math.max(0,Math.round((1-length/MAX)*100));$('#meter').style.width=p+'%';$('#inkText').textContent=p+'%'}
function pos(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(W,(e.clientX-r.left)*W/r.width)),y:Math.max(0,Math.min(H,(e.clientY-r.top)*H/r.height))}}
function allowed(p){if(level===0)return p.y>120&&p.y<350&&!(p.x<126&&p.y>310)&&!(p.x>274&&p.y>310)&&Math.hypot(p.x-60,p.y-285)>24;if(level===1)return p.y>100&&p.y<390&&!(p.x<70&&p.y>175)&&!(p.x>280&&p.y>365)&&Math.hypot(p.x-53,p.y-159)>15;return p.y>105&&p.y<350&&Math.hypot(p.x-200,p.y-375)>26}
canvas.addEventListener('pointerdown',e=>{if(mode!=='draw')return;let p=pos(e);if(!allowed(p)){ $('#guide').textContent='✎ 從空白處開始畫線吧！';return}drawPointer=e.pointerId;canvas.setPointerCapture(e.pointerId);points=[p];e.preventDefault()});canvas.addEventListener('pointermove',e=>{if(drawPointer!==e.pointerId||mode!=='draw')return;let p=pos(e),prev=points[points.length-1],d=Math.hypot(p.x-prev.x,p.y-prev.y);if(d<2)return;if(!allowed(p))return;let remaining=MAX-length;if(remaining<=0)return;if(d>remaining){p={x:prev.x+(p.x-prev.x)*remaining/d,y:prev.y+(p.y-prev.y)*remaining/d};d=remaining}points.push(p);length+=d;updateInk();scenery();e.preventDefault()});function finish(e){if(drawPointer!==e.pointerId)return;drawPointer=null;if(points.length<2||length<15){points=[];length=0;updateInk();$('#guide').textContent='再畫長一點，才能幫上忙喔！';scenery();return}mode='run';$('#guide').textContent='✨ 看看你的點子會發生什麼！';sfx(520)}canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',()=>{drawPointer=null;points=[];length=0;updateInk();scenery()});
function lineHeight(x,y,oldY,r){let best=null;for(let i=1;i<points.length;i++){let a=points[i-1],b=points[i];if(Math.abs(b.x-a.x)<.1||x<Math.min(a.x,b.x)-r*.3||x>Math.max(a.x,b.x)+r*.3)continue;let u=Math.max(0,Math.min(1,(x-a.x)/(b.x-a.x))),v=a.y+(b.y-a.y)*u;if(oldY+r<=v+9&&y+r>=v-2&&(best===null||v<best))best=v}return best}
function showResult(win){if(mode!=='run')return;mode=win?'win':'fail';sfx(win?750:180);if(win){unlocked=Math.max(unlocked,Math.min(3,level+2));document.querySelectorAll('[data-level]').forEach((b,i)=>b.disabled=i>=unlocked)}$('#resultTitle').textContent=win?(level===2?'小貓得救了！🎉':'太棒了，成功！ ✨'):'沒關係，再畫一次！';$('#resultDesc').textContent=win?(level===2?'三關都通過了，謝謝你救了小貓！':'喵嗚！你的畫筆真厲害！'):(level===2?'小貓被雨淋濕了，換個畫法吧。':'沒關係，重新畫一筆試試。');$('#next').hidden=!win;$('#next').textContent=level===2?'再玩一次 ↻':'下一關 →';$('#result').hidden=false;$('#guide').textContent=win?'太棒了！每個點子都值得試試。':'失敗也是好玩的發現！'}
function update(dt){t+=dt;if(level<2){let b=body,old=b.y;b.vy+=520*dt;if(level===0)b.vx=60;else b.vx=Math.min(110,b.vx+30*dt);b.x+=b.vx*dt;b.y+=b.vy*dt;let ground=null;if(level===0&&((b.x<130)||(b.x>270)))ground=310;if(level===1&&b.x<70)ground=180;if(level===1&&b.x>280)ground=365;let l=lineHeight(b.x,b.y,old,b.r);if(l!==null&&(ground===null||l<ground))ground=l;if(ground!==null&&old+b.r<=ground+8&&b.y+b.r>=ground){b.y=ground-b.r;b.vy=0}if(level===0&&b.x>310&&b.y>=280&&b.y<310)showResult(true);if(level===1&&b.x>305&&b.y>320&&b.y<365)showResult(true);if(b.y>H+25||b.x>W+30||t>12)showResult(false)}else{if(Math.floor(t*10)!==Math.floor((t-dt)*10)){let xs=[155,180,200,220,245,165,235,190,210];drops.push({x:xs[Math.floor(t*10)%xs.length],y:90})}for(const d of drops){let old=d.y;d.y+=130*dt;let l=lineHeight(d.x,d.y,old,0);if(l!==null)d.dead=true;else if(d.y>=355&&d.x>174&&d.x<226){d.dead=true;wet++}else if(d.y>420)d.dead=true}drops=drops.filter(d=>!d.dead);if(wet>=3)showResult(false);else if(t>=6)showResult(true)}}
function loop(ts){let dt=last?Math.min((ts-last)/1000,.033):0;last=ts;if(mode==='run')update(dt);scenery();raf=requestAnimationFrame(loop)}
$('#reset').onclick=()=>reset();$('#again').onclick=()=>reset();$('#next').onclick=()=>reset(level===2?0:level+1);$('#hint').onclick=()=>{$('#tip').hidden=!$('#tip').hidden};$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'♫':'♪';$('#sound').setAttribute('aria-label',sound?'關閉音效':'開啟音效');$('#sound').title=sound?'關閉音效':'開啟音效';if(sound)sfx()};document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>reset(Number(b.dataset.level)));reset();raf=requestAnimationFrame(loop);
</script></body></html>
